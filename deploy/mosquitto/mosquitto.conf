# ============================================================
# Mosquitto MQTT Broker —— 智聊·老年关怀模块
# 挂载于 docker-compose.yml 的 mosquitto 服务
# 口令文件由部署脚本生成：scripts/generate-mqtt-passwd.sh
# ============================================================

per_listener_settings false

# 内网监听（容器网络内，只暴露给 xiaozhi 网络与宿主机回环）
listener 1883

# 关闭匿名访问：所有连接必须用户名密码（ACL 按 username 生效）
allow_anonymous false

# 口令文件（容器内路径，由 compose 挂载）
password_file /mosquitto/config/passwd

# ACL 规则文件
acl_file /mosquitto/config/acl

# 持久化：命令主题的 persistent session 依赖它，保证老年端离线补投
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# 连接限制（按需调整）
max_connections 500
max_keepalive 300

# TLS 预留：生产部署时挂载证书后取消注释
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# tls_version tlsv1.2
